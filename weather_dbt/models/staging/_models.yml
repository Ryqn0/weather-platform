# weather_dbt/models/staging/_models.yml

version: 2
models:

  - name: stg_weather_readings
    columns:

      - name: location_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'locations')
                field: location_id

      - name: country
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: observed_at
        tests:
          - not_null

      - name: temperature_2m
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 60

      - name: relative_humidity_2m
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: wind_speed_10m
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0